; Waveshare ESP32-S3-Nano (ESP32-S3R8).
; board = arduino_nano_esp32 is pinout + 16 MB flash metadata, not Arduino framework.
; See docs/firmware.md
[env:esp32-s3-nano]
platform = espressif32
board = arduino_nano_esp32
framework = espidf
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
upload_protocol = esptool
; TFLM C++ OOMs if SCons uses every core (pio run without -j). Cap at 2.
extra_scripts = pre:scripts/limit_jobs.py

; Set these to the USB Serial/JTAG port from `pio device list` (303A:4001).
upload_port = COM8
monitor_port = COM8
; Windows USB Serial/JTAG: RTS/DTR resets the chip and drops the COM port.
monitor_rts = 0
monitor_dtr = 0
