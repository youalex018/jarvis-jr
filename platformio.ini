; Waveshare ESP32-S3-Nano
; First IDF flash: jumper B1 to GND, tap RST, remove jumper (RGB purple),
; pio device list -> 303A:1001, set upload_port to that COM.
[env:esp32-s3-nano]
platform = espressif32
board = arduino_nano_esp32
framework = espidf
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
upload_protocol = esptool

upload_port = COM8
monitor_port = COM8
; USB Serial/JTAG: RTS/DTR would reset the chip and kill COM8 on Windows
monitor_rts = 0
monitor_dtr = 0
